<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SATHI - Nepal's Premier Social Experiences Marketplace</title>
    <meta name="description" content="SATHI is Nepal's elite social experience platform connecting travelers with verified local companions for authentic cultural tours, chiya spots, and safe hikes." />
    <meta name="keywords" content="sathi, nepal, travel companion, verified local guide, kathmandu tour, pokhara adventure, cultural exchange" />
    <meta name="theme-color" content="#C8A25E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SATHI" />
    <link rel="icon" type="image/png" href="/sathi-logo.jpeg" />
    <link rel="apple-touch-icon" href="/sathi-logo.jpeg" />
    <style>
      #sathi-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 50% 0%, #17191C 0%, #0F1113 60%);
      }
      #sathi-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #sathi-splash img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        object-fit: contain;
        box-shadow: 0 12px 48px rgba(200, 162, 94, 0.35), 0 0 0 1px rgba(200, 162, 94, 0.25);
        animation: splash-glow 2.4s ease-in-out infinite;
      }
      #sathi-splash .splash-word {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: #F5F6F7;
      }
      #sathi-splash .splash-word span { color: #C8A25E; }
      #sathi-splash .splash-dots { display: flex; gap: 7px; margin-top: 2px; }
      #sathi-splash .splash-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #C8A25E;
        opacity: 0.45;
        animation: splash-bounce 1.1s ease-in-out infinite;
      }
      #sathi-splash .splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      #sathi-splash .splash-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-glow {
        0%, 100% { box-shadow: 0 12px 48px rgba(200, 162, 94, 0.35), 0 0 0 1px rgba(200, 162, 94, 0.25); }
        50% { box-shadow: 0 16px 64px rgba(200, 162, 94, 0.55), 0 0 0 1px rgba(200, 162, 94, 0.45); }
      }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.35; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
    <meta property="og:title" content="SATHI - Nepal's Premier Social Experiences Marketplace" />
    <meta property="og:description" content="Discover verified companions for authentic treks, tea house crawls, and cultural journeys across Nepal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SATHI - Verified Nepal Companions" />
    <meta name="twitter:description" content="Authentic local travel connections in Nepal." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root">
      <div id="sathi-splash">
        <div class="splash-inner">
          <img src="/sathi-logo.jpeg" alt="SATHI" width="88" height="88" />
          <div class="splash-word">SATHI<span>.</span></div>
          <div class="splash-dots"><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
