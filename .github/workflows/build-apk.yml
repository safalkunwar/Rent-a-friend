name: Build Android APK

on:
  push:
    branches: [ main, master, mobileapp ]
  pull_request:
    branches: [ main, master, mobileapp ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Compile React Production Assets
        run: npm run build

      - name: Sync Web Code into Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon -Dorg.gradle.caching=true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sathi-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
